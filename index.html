<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 운동 루틴 생성기</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container">
            <h2>💪 AI 운동 루틴 생성기</h2>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <div class="container">
            <h1>당신만을 위한 AI 운동 루틴</h1>
            <p>
                운동 목적과 체력, 운동 가능한 시간을 입력하면
                AI가 맞춤형 운동 루틴을 생성해드립니다.
            </p>

            <a href="#generator" class="btn">
                루틴 만들기
            </a>
        </div>
    </section>

    <!-- Generator -->
    <section id="generator" class="generator">
        <div class="container">

            <h2>AI 운동 루틴 생성</h2>

            <form id="routineForm">

                <label>운동 목적</label>
                <select id="goal">
                    <option value="">선택하세요</option>
                    <option>다이어트</option>
                    <option>근력 증가</option>
                    <option>체력 향상</option>
                    <option>유지</option>
                </select>

                <label>현재 체력</label>
                <select id="level">
                    <option value="">선택하세요</option>
                    <option>초급</option>
                    <option>중급</option>
                    <option>고급</option>
                </select>

                <label>운동 가능 시간</label>
                <select id="time">
                    <option value="">선택하세요</option>
                    <option>20분</option>
                    <option>30분</option>
                    <option>45분</option>
                    <option>60분 이상</option>
                </select>

                <button type="submit">
                    AI 루틴 생성하기
                </button>

                <p id="message"></p>

                <div id="resultContainer" style="display: none; margin-top: 20px; padding: 20px; background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; white-space: pre-line; line-height: 1.6; text-align: left;"></div>

            </form>

        </div>
    </section>

    <!-- FAQ -->
    <section class="faq">
        <div class="container">

            <h2>자주 묻는 질문</h2>

            <div class="faq-item">
                <h3>AI가 어떻게 운동 루틴을 추천하나요?</h3>
                <p>
                    입력한 운동 목적과 체력 수준, 운동 시간을 바탕으로
                    맞춤 운동 계획을 생성합니다.
                </p>
            </div>

            <div class="faq-item">
                <h3>초보자도 사용할 수 있나요?</h3>
                <p>
                    네. 초급부터 고급까지 모두 사용할 수 있도록 설계되었습니다.
                </p>
            </div>

            <div class="faq-item">
                <h3>운동 루틴은 저장되나요?</h3>
                <p>
                    현재 버전에서는 저장 기능이 제공되지 않습니다.
                </p>
            </div>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="js/main.js"></script>

</body>
</html>
